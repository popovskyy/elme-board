<style>
/* Elme palette tuned for a tool: warm paper, sage band, olive actions, muted status fills that all read with charcoal text. */
@font-face { font-family: Karla; src: url("/fonts/Karla-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: Karla; src: url("/fonts/Karla-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: Karla; src: url("/fonts/Karla-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: Karla; src: url("/fonts/Karla-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "DM Serif Display"; src: url("/fonts/DMSerifDisplay-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
:root {
  --bg: #F5F4EF;
  --band: #E9EDE3;
  --surface: #FFFFFF;
  --surface-2: #F2F1EB;
  --line: #DDDBD2;
  --fg: #2F2E2A;
  --muted: #6B6F66;
  --accent: #55644A;
  --secondary: #ADBBA1;
  --on-accent: #FFFFFF;
  --ink-on: #2F2E2A;
  --st-todo: #E7E2D8;
  --st-progress: #E9C873;
  --st-qa: #C9D4DF;
  --st-review: #A3B8C9;
  --st-blocked: #E4A593;
  --st-done: #BCCAAE;
  --h-fe: #BCCAAE;
  --h-be: #C9D4DF;
  --h-qa: #E2D8C5;
  --h-roman: #E9C873;
  --rg-todo: #BDB7A8;
  --rg-progress: #D0A22B;
  --rg-qa: #7F9AB3;
  --rg-review: #4F7391;
  --rg-blocked: #C4573D;
  --rg-done: #55644A;
  --shadow: 0 1px 2px rgb(47 46 42 / .05);
  --warn-text: #9E3F2A;
  --ok-text: #55644A;
  --font: Karla, ui-sans-serif, system-ui, sans-serif;
  --display: "DM Serif Display", Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --tap: 50px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 15px/20px var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  overscroll-behavior-y: contain;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: .02em; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band);
  display: grid; gap: 14px; padding-block: 16px 0; border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
h1 { margin: 0; font: 400 32px/35px var(--display); text-wrap: balance; display: flex; align-items: baseline; gap: 10px; }
h1 span { font: 500 15px/14px var(--font); letter-spacing: .5px; }
.sub { color: var(--muted); font-size: 14px; }
.pc-status {
  display: inline-flex; align-items: center; gap: 8px; margin-left: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 0;
  padding: 8px 14px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); min-height: 40px;
}
.pc-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.pc-status.online .dot { background: var(--ok-text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok-text) 25%, transparent); }
.pc-status.offline .dot { background: var(--warn-text); }
.pc-status .ico { width: 16px; height: 16px; }
.pc-status.offline { border-color: color-mix(in srgb, var(--st-blocked) 50%, var(--line)); }
.counters { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.counter { display: flex; gap: 6px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 8px 16px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); white-space: nowrap; min-height: 40px; }
.counter:hover { border-color: var(--accent); }
.counters .counter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.counters .counter[aria-pressed="true"] span { color: inherit; }
.counter b { font-size: 17px; }
.counter span { color: var(--muted); font-size: 13px; }
.counter.alert { border-color: var(--warn-text); background: color-mix(in srgb, var(--st-blocked) 30%, var(--surface)); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 6px 12px; margin-right: 10px; color: var(--muted); font-weight: 700; letter-spacing: .01em; min-height: var(--tap); }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.filters input, .filters select { background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; min-width: 0; min-height: 44px; }
.filters input { width: 220px; max-width: 60vw; }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); border-radius: 0; overflow: hidden; }
.seg button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seq { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 2.2em; display: inline-block; }
.wavebar { display: flex; align-items: center; gap: 10px; margin-left: auto; font: 600 13px var(--font); color: var(--muted); white-space: nowrap; }
.more { border-top: 1px solid var(--line); padding-top: 10px; }
.more > summary { cursor: pointer; font-weight: 700; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; min-height: 36px; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: '+'; margin-left: auto; font-size: 18px; }
.more[open] > summary::after { content: '–'; }
.more[open] { display: grid; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 0; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.chip.ready { background: color-mix(in srgb, var(--st-done) 45%, var(--surface)); color: var(--ok-text); }
.chip.work { background: color-mix(in srgb, var(--st-progress) 40%, var(--surface)); color: var(--fg); }
.chip.work::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.tool { background: var(--surface-2); color: var(--fg); }
@media (prefers-reduced-motion: no-preference) { .chip.work::before { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .25; } } }
.runbox { background: var(--surface-2); border: 1px solid var(--line); border-radius: 0; padding: 12px; display: grid; gap: 10px; }
.runbox .runhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.runbox pre { margin: 0; max-height: 240px; overflow: auto; padding: 12px; border-radius: 0; background: #1d211b; color: #ecede6; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
.runner-pick { display: grid; gap: 8px; margin-bottom: 4px; }
.runner-pick .label { font-size: 13px; font-weight: 700; color: var(--muted); }

/* Filters: hide done, link-style buttons in group headers */
.hide-done { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; min-height: 44px; font-weight: 700; color: var(--muted); }
.hide-done .ico { width: 16px; height: 16px; }
.hide-done[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.linkbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 8px; min-height: 32px; font: 600 13px var(--font); color: var(--muted); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.linkbtn .ico { width: 14px; height: 14px; }
.linkbtn:hover { color: var(--fg); }
.linkbtn.strong { color: var(--accent); }
.linkbtn:disabled { opacity: .45; }
.group.folded { margin-bottom: 6px; }
.group.folded h2 { font-size: 16px; color: var(--muted); margin: 0; padding: 6px 0; border-bottom: 1px dashed var(--line); }

/* Queue */
.queue { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--st-progress); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 22px; }
.queue h2 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font: 400 21px/1.2 var(--display); margin: 0 0 8px; }
.queue h2 small { color: var(--muted); font: 600 13px var(--font); }
.queue h2 .linkbtn { margin-left: auto; }
.queue.empty-q { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 8px; }
.queue.empty-q h2 { margin: 0; font-size: 18px; }
.queue.empty-q p { margin: 0; }
.queue.empty-q .linkbtn { margin-left: auto; }
.queue ol { list-style: none; margin: 0; padding: 0; display: grid; }
.queue li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.queue .qmain { display: flex; gap: 10px; align-items: baseline; flex: 1 1 280px; min-width: 0; background: none; border: 0; padding: 4px 0; text-align: left; }
.queue .qttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.queue .qmain:hover .qttl { text-decoration: underline; }
.queue .qpos { font: 600 12px var(--mono); color: var(--muted); min-width: 3ch; text-align: center; }
.queue .qbtns { display: flex; gap: 2px; margin-left: auto; }

/* Overview: status donut, plan stage rings */
.ring { display: block; flex: none; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; }
.ring .trk { stroke: var(--surface-2); }
.overview { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 22px; }
.ov-status { display: flex; align-items: center; gap: 18px; }
.donut { position: relative; flex: none; }
.donut .seg { cursor: pointer; }
.donut.picked .seg:not(.on) { opacity: .28; }
.donut .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut .mid b { font: 400 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.donut .mid span { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .02em; margin-top: 3px; max-width: 86px; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, auto); gap: 2px 6px; }
.legend button { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 1px solid transparent; padding: 5px 10px 5px 8px; min-height: 32px; font-weight: 600; font-size: 13px; white-space: nowrap; text-align: left; }
.legend button i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.legend button b { margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }
.legend button:hover, .legend button.hot { background: var(--surface-2); }
.legend button[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); }
.legend button.zero { color: var(--muted); font-weight: 500; }
.ov-waves { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; min-width: 0; }
.wcard { flex: none; display: grid; grid-template-columns: auto auto; gap: 2px 10px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); padding: 8px 14px 8px 10px; min-width: 150px; max-width: 230px; }
.wcard .wring { position: relative; grid-row: 1 / 3; }
.wcard .wring span { position: absolute; inset: 0; display: grid; place-content: center; font: 700 11px var(--mono); color: var(--fg); }
.wcard .wn { font-weight: 700; font-size: 13px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wcard .ws { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.wcard .ws em { font-style: normal; font-weight: 700; color: var(--warn-text); }
.wcard .ws u { text-decoration: none; font-weight: 700; color: var(--fg); }
.wcard:hover { border-color: var(--accent); }
.wcard[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }
.wcard.complete .wn { color: var(--muted); }
.ov-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); font-size: 13px; }
.ov-foot .linkbtn:last-child { margin-left: auto; }
.ov-now { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
.nowrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: color-mix(in srgb, var(--st-progress) 16%, var(--surface)); border-left: 4px solid var(--rg-progress); padding: 6px 12px; }
.nowrow .nowmain { display: flex; gap: 10px; align-items: baseline; min-width: 0; background: none; border: 0; padding: 4px 0; text-align: left; }
.nowrow .nowmain b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrow .nowmain:hover b { text-decoration: underline; }
.nowrow .timer { font-variant-numeric: tabular-nums; font-weight: 700; }
.nowrow .nowline { flex: 1 1 200px; min-width: 0; color: var(--muted); font: 12px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrow .linkbtn { margin-left: auto; }
.overview.mini { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; }
.overview.mini .ov-now, .overview.mini .ov-foot { flex: 1 1 100%; }
.ov-mini { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; min-height: 36px; text-align: left; flex: 1; }
.ov-mini b { font: 400 22px/1 var(--display); }
.ov-mini span { color: var(--muted); font-size: 13px; }
.ov-mini em { font-style: normal; font-weight: 700; color: var(--warn-text); }
.qam { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ok-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.qam .ico { width: 13px; height: 13px; }
.qam.fail { color: var(--warn-text); }
.qam.part { color: var(--muted); }
.chip.unlocks { background: var(--surface-2); color: var(--muted); }
.tring { display: inline-block; vertical-align: middle; flex: none; }
.queue .qmain .tring { align-self: center; }
@media (prefers-reduced-motion: no-preference) {
  .ring .seg { transition: stroke-width 160ms var(--ease-out), opacity 160ms ease; }
  .donut .seg:hover, .donut .seg.hot { stroke-width: 22px; }

/* Insights */

/** What the PC works on right now. Timer and last output line are patched every second (patchNow), not rebuilt. */
function nowRunning() {
  const runs = Object.values(state.runs || {}).filter((r) => (r.status === 'running' || r.status === 'queued') && state.tickets.has(r.ticketId));
  if (!runs.length) return '';
  return `<div class="ov-now">${runs.map((r) => {
    const t = state.tickets.get(r.ticketId);
    return `<div class="nowrow"><span class="chip work">${r.status === 'running' ? 'Running' : 'Starting'}</span>
      <button class="nowmain" type="button" data-id="${esc(t.id)}"><span class="mono">${esc(t.id)}</span><b>${esc(t.title)}</b></button>${holderTool(t)}
      <span class="timer" data-run-timer="${esc(r.id)}"></span><span class="nowline" data-run-line="${esc(r.id)}"></span>
      ${state.canWrite ? `<button class="linkbtn" type="button" data-qact="stop" data-run="${esc(r.id)}">${ico('stop')}Stop</button>` : ''}</div>`;
  }).join('')}</div>`;
}
function patchNow() {
  document.querySelectorAll('#view [data-run-timer]').forEach((el) => {
    const r = state.runs?.[el.dataset.runTimer]; if (!r) return;
    const sec = Math.max(0, Math.round((Date.now() - (r.startedAt || Date.now())) / 1000));
    el.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    const line = el.parentElement.querySelector('[data-run-line]');
    const last = (r.lastLines || []).filter((l) => String(l).trim()).slice(-1)[0] || 'Waiting for agent output…';
    if (line && line.textContent !== last) line.textContent = last;
  });
}
/** The whole plan at a glance: status donut (tap an arc or a legend row to filter) and one ring per plan stage. */
function renderOverview() {
  const all = live();
  if (!all.length) return '';
  const done = all.filter((t) => t.status === 'done').length;
  const pct = Math.round(done / all.length * 100);
  const counts = statusCounts(all);
  const picked = state.status && RING[state.status];
  const mid = picked ? [counts.find(([k]) => k === state.status)[1], STATUS[state.status].label] : [`${pct}%`, `${done} of ${all.length} done`];
  const legend = counts.map(([k, n]) => `<li><button type="button" class="${n ? '' : 'zero'}" data-status-pick="${k}" aria-pressed="${state.status === k}" style="--c:var(${RING[k]})"><i></i>${STATUS[k].label}<b>${n}</b></button></li>`).join('');
  const waves = [...new Map(all.filter((t) => t.wave).sort((a, b) => a.wave - b.wave).map((t) => [t.wave, t.waveName])).entries()].map(([w, name]) => {
    const inWave = all.filter((t) => t.wave === w);
    const d = inWave.filter((t) => t.status === 'done').length;
    const mine = inWave.filter(FOCUS.mine).length;
    const active = inWave.filter((t) => t.waiting).length;
    const p = Math.round(d / inWave.length * 100);
    const note = mine ? ` · <em>${mine} for you</em>` : active ? ` · <u>${active} with agents</u>` : '';
    return `<button type="button" class="wcard${d === inWave.length ? ' complete' : ''}" data-wave-pick="${w}" aria-pressed="${state.wave === w}" title="${esc(name)}: ${d} of ${inWave.length} done">
      <span class="wring">${ring(ringParts(inWave), 42, 6)}<span>${p === 100 ? '✓' : p}</span></span>
      <span class="wn">${w} · ${esc(name)}</span><span class="ws">${d}/${inWave.length} done${note}</span></button>`;
  }).join('');
  const waveName = state.wave ? all.find((t) => t.wave === state.wave)?.waveName : '';
  const clear = picked || state.wave ? `<span>Showing ${[picked ? STATUS[state.status].label : '', state.wave ? `stage ${state.wave} · ${esc(waveName || '')}` : ''].filter(Boolean).join(' in ')}</span><button class="linkbtn" type="button" data-ov-clear>${ico('x')}Show everything</button>` : '';
  if (state.ovMini) {
    const mine = all.filter(FOCUS.mine).length;
    return `<section class="overview mini" aria-label="Progress overview">
      <button class="ov-mini" type="button" data-ov-toggle aria-expanded="false" title="Show the progress overview">${ring(ringParts(all), 30, 6)}<b>${pct}%</b><span>${done} of ${all.length} done${mine ? ` · <em>${mine} for you</em>` : ''}</span></button>
      <button class="linkbtn" type="button" data-ov-toggle>Show overview</button>${nowRunning()}${clear ? `<div class="ov-foot">${clear}</div>` : ''}</section>`;
  }
  return `<section class="overview" aria-label="Progress overview">${nowRunning()}
    <div class="ov-status"><div class="donut${picked ? ' picked' : ''}" data-mid="${esc(mid[0])}|${esc(mid[1])}">${ring(ringParts(all), 148, 18, { pick: true })}<div class="mid"><b>${mid[0]}</b><span>${mid[1]}</span></div></div>
      <ul class="legend">${legend}</ul></div>
    ${waves ? `<div class="ov-waves">${waves}</div>` : ''}<div class="ov-foot">${clear}<button class="linkbtn" type="button" data-ov-toggle aria-expanded="true">Fold overview</button></div></section>`;
}
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2800); }

// Done tickets stay out of the way unless asked for: Show done, Status Done, the done counter, or a search.
function hidingDone() { return state.hideDone && !state.q && !state.wave && state.focus !== 'done' && state.status !== 'done' && state.status !== 'archived'; }
function visible({ withDone = false } = {}) {
  const q = state.q.toLowerCase();
  const hide = !withDone && hidingDone();
  const pool = state.status === 'archived' ? [...state.tickets.values()].filter((t) => t.archived) : live();
  return pool
    .filter((t) => (!state.kind || t.kind === state.kind) && (!state.wave || t.wave === state.wave) && (!state.epic || t.epic === state.epic) && (!state.focus || FOCUS[state.focus](t))
      && (!state.status || state.status === 'archived' || t.status === state.status)
      && (!state.who || (state.who === 'none' ? !t.holder : t.holder === state.who))
      && !(hide && t.status === 'done')
      && (!q || `${t.id} ${t.title} ${t.epic} ${t.branch || ''} ${t.scope || ''} ${t.ref || ''}`.toLowerCase().includes(q)))
    .sort((a, b) => ((a.seq ?? 999) - (b.seq ?? 999)) || ((a.order || 0) - (b.order || 0)));
}

function renderCounters() {
  const all = live();
  const n = (f) => all.filter(f).length;
  const openDec = [...state.decisions.values()].filter((d) => d.status !== 'decided').length;
  const mine = n((t) => t.status === 'review' || t.status === 'blocked');
  const chipIcon = { mine: 'bell', ready: 'check', agents: 'play', claude: 'spark', cursor: 'cursor', done: 'flag' };
  const chip = (key, num, label, cls = '') => `<button class="counter${cls}" data-focus="${key}" aria-pressed="${state.focus === key}">${ico(chipIcon[key] || 'list')}<b>${num}</b><span>${label}</span></button>`;
  const withClaude = n((t) => t.waiting && (t.runner || 'claude') === 'claude');
  const withCursor = n((t) => t.waiting && t.runner === 'cursor');
  $('#counters').innerHTML = [
    chip('mine', mine, 'waiting for you', mine ? ' alert' : ''),
    chip('ready', n(isReady), 'ready to start'),
    chip('agents', n((t) => t.waiting), 'with agents'),
    chip('claude', withClaude, 'with Claude'),
    chip('cursor', withCursor, 'with Cursor'),
    chip('done', n((t) => t.status === 'done'), `of ${all.length} done`),
    `<button class="counter" data-goto="decisions">${ico('list')}<b>${openDec}</b><span>open decisions</span></button>`,
  ].join('');
  renderPcStatus();
  // Tab title and the installed app icon carry what waits for Roman.
  document.title = mine ? `(${mine}) Elme Board` : 'Elme Board';
  try { mine ? navigator.setAppBadge?.(mine) : navigator.clearAppBadge?.(); } catch {}
  $('#hide-done').setAttribute('aria-pressed', String(state.hideDone));
  const epics = [...new Set(all.sort((a, b) => a.order - b.order).map((t) => t.epic))];
  const sel = $('#epic');
  if (sel.options.length - 1 !== epics.length) sel.innerHTML = '<option value="">All epics</option>' + epics.map((e) => `<option${e === state.epic ? ' selected' : ''}>${esc(e)}</option>`).join('');
}

function mitem(t, c) {
  return `<button class="mitem" data-id="${esc(t.id)}" style="--gc:var(${c})">
    <div class="r1"><span>${ticketRing(t)} <span class="seq">#${t.seq ?? '–'}</span><span class="mono">${esc(t.id)}</span></span>${pill(t.status)}</div>
    <div class="ttl">${esc(t.title)}</div>
    <div class="r3">${holder(t.holder)}<span>${esc(t.waveName || t.epic)}</span>${badges(t)}${qaMini(t)}${unlocksChip(t)}</div></button>`;
}
function waveGroups(list) {
  const all = live();
  const withDone = visible({ withDone: true });
  const waves = [...new Map(all.filter((t) => t.wave).sort((a, b) => a.wave - b.wave).map((t) => [t.wave, t.waveName])).entries()];
  return waves.filter(([w]) => !state.wave || w === state.wave).map(([w, name]) => {
    const inWave = all.filter((t) => t.wave === w);
    const done = inWave.filter((t) => t.status === 'done').length;
    const open = state.openWaves.has(w);
    const rows = (open ? withDone : list).filter((t) => t.wave === w);
    const hiddenDone = hidingDone() && !open ? withDone.filter((t) => t.wave === w && t.status === 'done').length : 0;
    const ready = inWave.filter(isReady).length;
    return { wave: w, title: `<span class="wn">${w}</span> ${esc(name)}`, rows, c: '--accent', progress: [done, inWave.length], parts: ringParts(inWave), hiddenDone, open, ready };
  });
}
function waveTools(g) {
  if (!g.wave) return '';
  const toggle = g.hiddenDone || g.open && hidingDone()
    ? `<button class="linkbtn" type="button" data-wave-toggle="${g.wave}">${g.open ? 'Hide done' : `Show ${g.hiddenDone} done`}</button>` : '';
  const ready = g.ready && state.canWrite ? queueReadyBtn(g.ready, g.wave) : '';
  return toggle + ready;
}
function queueReadyBtn(n, wave = '') {
  return `<button class="linkbtn strong" type="button" data-queue-ready="${wave}">${ico('play')}Queue ${n} ready</button>`;
}
/** What the PC runs next, in the order the runner picks (lib/logic.mjs queueCompare). */
function renderQueue() {
  const q = queued(live());
  const ready = live().filter(isReady).length;
  if (!q.length && !ready) return '';
  const tool = state.canWrite && ready ? queueReadyBtn(ready) : '';
  if (!q.length) return `<section class="queue empty-q"><h2>Queue <small>empty</small></h2><p class="empty">Nothing is queued for the PC.</p>${tool}</section>`;
  const firstFree = q.findIndex((t) => !activeRunFor(t.id));
  const rows = q.map((t, i) => {
    const run = activeRunFor(t.id);
    const st = run ? `<span class="chip work">${ico('play')}Running</span>` : i === firstFree ? '<span class="chip tool">Next</span>' : `<span class="qpos">${i + 1}</span>`;
    const btns = !state.canWrite ? '' : run
      ? `<button class="linkbtn" type="button" data-qact="stop" data-run="${esc(run.id)}">${ico('stop')}Stop</button>`
      : `${i > firstFree ? `<button class="linkbtn" type="button" data-qact="run-next" data-tid="${esc(t.id)}">Run next</button>` : ''}<button class="linkbtn" type="button" data-qact="cancel" data-tid="${esc(t.id)}">${ico('x')}Cancel</button>`;
    return `<li><button class="qmain" type="button" data-id="${esc(t.id)}">${ticketRing(t)}<span class="mono">${esc(t.id)}</span><span class="qttl">${esc(t.title)}</span></button>${holderTool(t)}${st}<span class="qbtns">${btns}</span></li>`;
  }).join('');
  return `<section class="queue"><h2>Queue <small>${q.length}</small>${state.metaSeen && !pcOnline() ? '<span class="chip" style="color:var(--warn-text)">PC offline</span>' : ''}${tool}</h2><ol>${rows}</ol></section>`;
}
function renderTable() {
  const list = visible();
  const groups = state.group === 'plan'
    ? waveGroups(list)
    : GROUPS.map(([name, f, c]) => ({ title: esc(name), rows: list.filter(f), c }));
  const body = groups.map((g) => {
    const { title, rows, c, progress } = g;
    const name = title;
    const tools = waveTools(g);
    const bar = progress ? `<span class="wavebar">${progress[0]}/${progress[1]} done · ${Math.round(progress[0] / progress[1] * 100)}%${ring(g.parts, 24, 5)}</span>` : '';
    if (!rows.length) {
      // A wave whose open work is all done folds to one line.
      return g.hiddenDone ? `<section class="group folded"><h2><span class="dot" style="background:var(${c})"></span>${name}${bar}${tools}</h2></section>` : '';
    }
    const head = `<h2><span class="dot" style="background:var(${c})"></span>${name} <small>${rows.length}</small>${tools}${bar}</h2>`;
    if (narrow.matches) return `<section class="group">${head}<div class="mlist">${rows.map((t) => mitem(t, STATUS[t.status]?.c || c)).join('')}</div></section>`;
    return `<section class="group">${head}
      <div class="tablewrap" style="--gc:var(${c})"><table><thead><tr><th>Ticket</th><th>${state.group === 'plan' ? 'Epic' : 'Plan'}</th><th>Holder</th><th>Status</th><th>Depends on</th><th>Updated</th></tr></thead><tbody>
      ${rows.map((t) => `<tr class="row" tabindex="0" data-id="${esc(t.id)}">
        <td class="title"><div class="t">${ticketRing(t)}<span class="seq">#${t.seq ?? '–'}</span><span class="mono">${esc(t.id)}</span><span>${esc(t.title)}</span>${badges(t)}${qaMini(t)}${unlocksChip(t)}</div></td>
        <td>${esc(state.group === 'plan' ? t.epic : (t.wave ? t.wave + ' · ' + t.waveName : t.epic))}</td><td>${t.waiting ? holderTool(t) : holder(t.holder)}</td>
        <td class="statuscell">${statusCell(t.archived ? 'archived' : t.status)}</td><td>${deps(t)}</td><td class="upd">${when(t.updatedAt)}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  }).join('');
  const filtered = state.focus || state.q || state.kind || state.epic || state.status || state.who || state.wave;
  const queue = filtered ? '' : renderQueue();
  const hasRows = groups.some((g) => g.rows.length);
  return renderOverview() + queue + body + (hasRows ? '' : `<p class="empty">${filtered ? 'No tickets match. Clear the filters to see all tickets.' : 'No open tickets.'}</p>`);
}

function renderKanban() {
  const list = visible({ withDone: true });
  const jump = narrow.matches ? `<nav class="jump" aria-label="Columns">${KANBAN_ORDER.map((s) => `<button data-jump="${s}" style="--cc:var(${STATUS[s].c})"><i></i>${STATUS[s].label} ${list.filter((t) => t.status === s).length}</button>`).join('')}</nav>` : '';
  return `${renderOverview()}${jump}<div class="kanban">${KANBAN_ORDER.map((s) => {
    const cards = list.filter((t) => t.status === s);
    return `<section class="col" data-status="${s}" style="--cc:var(${STATUS[s].c})"><header>${STATUS[s].label}<span>${cards.length}</span></header>
      <div class="cards" id="col-${s}">${cards.map((t) => `<button class="card" draggable="${!narrow.matches}" data-id="${esc(t.id)}">
        <div class="meta"><span><span class="seq">#${t.seq ?? '–'}</span><span class="mono">${esc(t.id)}</span></span>${t.waiting ? holderTool(t) : holder(t.holder)}</div>
        <div class="ttl">${esc(t.title)}</div>
        <div class="meta"><span class="kind">${esc(t.wave ? t.wave + ' · ' + t.waveName : t.epic)}</span>${badges(t)}${qaMini(t)}${unlocksChip(t)}</div>
      </button>`).join('')}</div></section>`;
  }).join('')}</div>`;
}

function decisionOptions(d) {
  return String(d.options || '').split(/\s*·\s*/).map((s) => s.trim()).filter(Boolean);
}

function renderDecideControls(d) {
  if (d.status === 'decided') {
    return `<div class="prose">${inline(d.chosen)}</div>
      <div class="btns" style="margin-top:8px"><button class="btn" type="button" data-act="reopen-decision" data-dec="${esc(d.id)}">Change</button></div>`;
  }
  const opts = decisionOptions(d).map((o) =>
    `<button class="btn" type="button" data-act="pick-decision" data-dec="${esc(d.id)}" data-chosen="${esc(o)}">${esc(o)}</button>`
  ).join('');
  return `<div class="prose" style="margin-bottom:8px">${inline(d.options)}</div>
    <div class="btns" style="flex-wrap:wrap;gap:6px">${opts}</div>
    <label for="dec-${esc(d.id)}" style="display:block;margin-top:10px">Or write your own</label>
    <textarea id="dec-${esc(d.id)}" rows="2" placeholder="Chosen option…"></textarea>
    <div class="btns" style="margin-top:8px"><button class="btn primary" type="button" data-act="write-decision" data-dec="${esc(d.id)}">${ico('check')}Decide</button></div>`;
}

function renderDecisions() {
  const list = [...state.decisions.values()].sort((a, b) => Number(a.id.slice(1)) - Number(b.id.slice(1)));
  const st = (d) => d.status === 'decided' ? '<span class="pill" style="background:var(--st-done)">Decided</span>' : '<span class="pill" style="background:var(--st-progress)">Open</span>';
  if (narrow.matches) return `<div class="mlist">${list.map((d) => `<div class="mitem" style="--gc:var(${d.status === 'decided' ? '--st-done' : '--st-progress'})">
    <div class="r1"><span class="mono">${esc(d.id)}</span>${st(d)}</div><div class="ttl">${esc(d.title)}</div>
    ${renderDecideControls(d)}<div class="r3">Affects ${esc(d.affects)}</div></div>`).join('')}</div>`;
  return `<div class="tablewrap"><table class="decisions"><thead><tr><th>#</th><th>Decision</th><th>Production today</th><th>Options / chosen</th><th>Status</th><th>Affects</th></tr></thead><tbody>
    ${list.map((d) => `<tr><td class="mono">${esc(d.id)}</td><td><strong>${esc(d.title)}</strong></td><td>${inline(d.prod)}</td>
      <td>${renderDecideControls(d)}</td>
      <td>${d.status === 'decided' ? '<span class="pill" style="background:var(--st-done)">Decided</span>' : '<span class="pill" style="background:var(--st-progress)">Open</span>'}</td>
      <td>${esc(d.affects)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* Insights: the week, the two tools, where agent time went, what holds the most work. */
const DAY = 24 * 60 * 60 * 1000;
const nowMs = () => Date.now() + (state.skew || 0);
function fmtDur(ms) {
  const m = Math.round(ms / 60000);
  if (m < 1) return '<1 min';
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`;
}
function fmtAge(ms) { const h = Math.floor(ms / 3600000); return h < 1 ? 'now' : h < 48 ? `${h} h` : `${Math.floor(h / 24)} d`; }
const runMs = (r) => Math.max(0, (r.endedAt || (r.status === 'running' ? nowMs() : r.startedAt)) - r.startedAt);
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor((s.length - 1) / 2)] : 0; };
function loadStats(force = false) {
  if (!window.boardStats || state.statsLoading || (!force && state.stats && Date.now() - state.stats.at < 5 * 60 * 1000)) return;
  state.statsLoading = true;
  window.boardStats().then((s) => { state.stats = { runs: s.runs || [], days: s.days || 90, at: Date.now() }; }, () => { state.stats = { runs: [], days: 90, at: Date.now(), failed: true }; })
    .finally(() => { state.statsLoading = false; if (state.view === 'insights') render(); });
}
function weekFacts() {
  const all = live(), now = nowMs();
  const closed = all.filter((t) => t.status === 'done' && now - (t.updatedAt || 0) < 7 * DAY).sort((a, b) => b.updatedAt - a.updatedAt);
  const mine = all.filter(FOCUS.mine).sort((a, b) => a.updatedAt - b.updatedAt);
  const stuck = all.filter((t) => !['todo', 'done', 'review', 'blocked'].includes(t.status) && !activeRunFor(t.id) && now - (t.updatedAt || 0) > 3 * DAY).sort((a, b) => a.updatedAt - b.updatedAt);
  return { all, now, closed, mine, stuck, done: all.filter((t) => t.status === 'done').length, working: all.filter((t) => t.waiting) };
}
function toolFacts(runs) {
  return ['claude', 'cursor'].map((tool) => {
    const mineRuns = runs.filter((r) => r.runner === tool);
    const ended = mineRuns.filter((r) => r.status !== 'running' && r.status !== 'queued');
    const n = (s) => ended.filter((r) => r.status === s).length;
    return { tool, runs: mineRuns.length, ended: ended.length, done: n('done'), failed: n('failed'), stopped: n('stopped'), median: median(ended.map(runMs)), total: mineRuns.reduce((a, r) => a + runMs(r), 0) };
  });
}
function renderInsights() {
  const f = weekFacts();
  const row = (t, note) => `<li><button type="button" data-id="${esc(t.id)}">${ticketRing(t)}<span class="mono">${esc(t.id)}</span><b>${esc(t.title)}</b><small>${note}</small></button></li>`;
  const tile = (title, list, c, note, empty) => `<section class="tile" style="--tc:var(${c})"><h3>${title}</h3><div class="num">${list.length}</div>
    ${list.length ? `<ul class="tlist">${list.slice(0, 6).map((t) => row(t, note(t))).join('')}${list.length > 6 ? `<li class="more-n">and ${list.length - 6} more</li>` : ''}</ul>` : `<p class="empty">${empty}</p>`}</section>`;
  const tiles = `<div class="tiles">
    ${tile('Closed in the last 7 days', f.closed, '--rg-done', (t) => when(t.updatedAt).split(',')[0], 'Nothing closed this week.')}
    ${tile('Waiting for you', f.mine, '--rg-blocked', (t) => `${fmtAge(f.now - t.updatedAt)} · ${t.status === 'blocked' ? 'question' : 'review'}`, 'Nothing waits for you.')}
    ${tile('No movement for 3+ days', f.stuck, '--rg-progress', (t) => fmtAge(f.now - t.updatedAt), 'Nothing is stuck.')}</div>`;

  let tools, costly = '';
  if (!state.stats) tools = '<p class="empty">Loading run history…</p>';
  else if (state.stats.failed) tools = '<p class="empty">Run history could not load. Open the tab again to retry.</p>';
  else if (!state.stats.runs.length) tools = `<p class="empty">No agent runs in the last ${state.stats.days} days.</p>`;
  else {
    const rows = toolFacts(state.stats.runs).filter((x) => x.runs).map((x) => {
      const pct = x.ended ? Math.round(x.done / x.ended * 100) : 0;
      return `<tr><td>${ico(x.tool === 'cursor' ? 'cursor' : 'spark')} <strong>${x.tool === 'cursor' ? 'Cursor' : 'Claude'}</strong></td><td class="n">${x.runs}</td>
        <td class="n"><span class="rate" title="${x.done} of ${x.ended} ended runs finished"><i><b style="width:${pct}%"></b></i>${pct}%</span></td>

  const col = e.target.closest?.('.col'); if (!col || !dragId) return;
  e.preventDefault(); col.classList.remove('over');
  const t = state.tickets.get(dragId); dragId = null;
  const to = col.dataset.status;
  if (!t || t.status === to || !state.canWrite) return;
  try {
    const runner = preferredRunner();
    if (to === 'in_progress') await change(t, { ...assign(t, t.kind === 'BE' ? 'be' : 'fe'), runner }, `Roman started the ticket with the ${t.kind === 'BE' ? 'BE' : 'FE'} agent (${runner}).`, 'log');
    else if (to === 'in_qa') await change(t, { ...assign(t, 'qa'), runner }, `Roman sent the ticket to the QA agent (${runner}).`, 'log');
    else if (to === 'done') await change(t, done(t), 'Accepted after review.', 'log');
    else { toast('Open the ticket to do that.'); openPanel(t.id); }
  } catch (err) { toast(err.message); }
});

/* Events */
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  state.view = b.dataset.view;
  if (state.view === 'insights') loadStats();
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  try { localStorage.setItem('elme-board-view', state.view); } catch {}
  render();
});
$('#search').oninput = (e) => { state.q = e.target.value; render(); renderToolsCount(); };
$('#kind').onchange = (e) => { state.kind = e.target.value; render(); renderToolsCount(); };
$('#grouping').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; state.group = b.dataset.group; try { localStorage.setItem('elme-board-group', state.group); } catch {} render(); renderToolsCount(); };
$('#epic').onchange = (e) => { state.epic = e.target.value; render(); renderToolsCount(); };
$('#status').onchange = (e) => { state.status = e.target.value; savePick(); render(); renderToolsCount(); };
$('#holder').onchange = (e) => { state.who = e.target.value; render(); renderToolsCount(); };
$('#hide-done').onclick = () => {
  state.hideDone = !state.hideDone; state.openWaves.clear();
  try { localStorage.setItem('elme-board-hide-done', state.hideDone ? '1' : '0'); } catch {}
  render(); renderToolsCount();
};
$('#tools-toggle').onclick = () => {
  const open = !document.body.classList.contains('show-tools');
  document.body.classList.toggle('show-tools', open);
  $('#tools-toggle').setAttribute('aria-expanded', String(open));
};
function renderToolsCount() {
  const n = [state.q, state.kind, state.epic, state.status, state.who, state.wave].filter(Boolean).length + (state.group === 'status' ? 1 : 0) + (state.hideDone ? 0 : 1);
  const b = $('#tools-count'); b.hidden = !n; b.textContent = n;
}
$('#counters').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.goto) { document.querySelector(`.tabs [data-view="${b.dataset.goto}"]`).click(); return; }
  state.focus = state.focus === b.dataset.focus ? '' : b.dataset.focus;
  if (state.view === 'decisions') document.querySelector('.tabs [data-view="table"]').click(); else render();
});
narrow.addEventListener('change', render);
async function decide(id, chosen) {
  const d = state.decisions.get(id);
  if (!d) return toast(`No decision ${id}`);
  const text = String(chosen || '').trim();
  if (!text) return toast('Write or pick an option first.');
  try {
    await db.doc(`decisions/${id}`).update({ status: 'decided', chosen: text });
    state.decisions.set(id, { ...d, status: 'decided', chosen: text, version: (d.version ?? 1) + 1 });
    render();
    toast(`${id}: decided`);
  } catch (err) { toast(err.message || 'Could not save decision'); }
}

async function reopenDecision(id) {
  const d = state.decisions.get(id);
  if (!d) return;
  try {
    await db.doc(`decisions/${id}`).update({ status: 'open', chosen: null });
    state.decisions.set(id, { ...d, status: 'open', chosen: null, version: (d.version ?? 1) + 1 });
    render();
    toast(`${id}: open again`);
  } catch (err) { toast(err.message || 'Could not reopen decision'); }
}

$('#view').addEventListener('click', (e) => {
  const actBtn = e.target.closest('[data-act][data-dec]');
  if (actBtn) {
    e.preventDefault();
    const id = actBtn.dataset.dec;
    if (actBtn.dataset.act === 'pick-decision') return decide(id, actBtn.dataset.chosen);
    if (actBtn.dataset.act === 'write-decision') return decide(id, document.getElementById('dec-' + id)?.value);
    if (actBtn.dataset.act === 'reopen-decision') return reopenDecision(id);
    return;
  }
  const sp = e.target.closest('[data-status-pick], [data-seg]');
  if (sp) { const k = sp.dataset.statusPick || sp.dataset.seg; state.status = state.status === k ? '' : k; $('#status').value = state.status; savePick(); render(); renderToolsCount(); return; }
  const wp = e.target.closest('[data-wave-pick]');
  if (wp) { const w = Number(wp.dataset.wavePick); state.wave = state.wave === w ? 0 : w; savePick(); render(); renderToolsCount(); return; }
  const cr = e.target.closest('[data-copy-report]');
  if (cr) { const text = weeklyReport(); (navigator.clipboard?.writeText(text) || Promise.reject()).then(() => toast('Weekly report copied'), () => { download('elme-weekly-report.txt', text); }); return; }
  if (e.target.closest('[data-ov-toggle]')) { state.ovMini = !state.ovMini; try { localStorage.setItem('elme-board-overview', state.ovMini ? 'mini' : 'full'); } catch {} render(); return; }
  if (e.target.closest('[data-ov-clear]')) { state.status = ''; state.wave = 0; $('#status').value = ''; savePick(); render(); renderToolsCount(); return; }
  const wt = e.target.closest('[data-wave-toggle]');
  if (wt) { const w = Number(wt.dataset.waveToggle); state.openWaves.has(w) ? state.openWaves.delete(w) : state.openWaves.add(w); render(); return; }
  const qr = e.target.closest('[data-queue-ready]');
  if (qr) { queueReady(qr); return; }
  const qa = e.target.closest('[data-qact]');
  if (qa) {
    const t = state.tickets.get(qa.dataset.tid);
    (async () => {
      try {
        qa.disabled = true;
        if (qa.dataset.qact === 'stop') { await window.boardStopRun(qa.dataset.run); toast('Stop requested'); }
        else if (qa.dataset.qact === 'run-next' && t) { await db.doc(`tickets/${t.id}`).update(runNext(t, live())); toast(`${t.id}: runs next`); }
        else if (qa.dataset.qact === 'cancel' && t) await cancelTicket(t);
      } catch (err) { toast(err.message || 'Could not save'); qa.disabled = false; }
    })();
    return;
  }
  if (e.target.closest('textarea, input, label, .btns')) return;
  const j = e.target.closest('[data-jump]');
  if (j) { document.getElementById('col-' + j.dataset.jump)?.closest('.col').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', inline: 'center', block: 'nearest' }); return; }
  const el = e.target.closest('[data-id]'); if (el) openPanel(el.dataset.id);
});
// Hovering an arc or a legend row shows that status in the middle of the donut and lights its pair.
function hotStatus(k) {
  const d = $('#view .donut'); if (!d) return;
  d.querySelectorAll('.seg').forEach((s) => s.classList.toggle('hot', s.dataset.seg === k));
  $('#view').querySelectorAll('.legend button').forEach((b) => b.classList.toggle('hot', b.dataset.statusPick === k));
  const [num, label] = k ? [live().filter((t) => t.status === k).length, STATUS[k].label] : d.dataset.mid.split('|');
  d.querySelector('.mid b').textContent = num; d.querySelector('.mid span').textContent = label;
}
const hotOf = (e) => e.target.closest?.('[data-seg], [data-status-pick]');
$('#view').addEventListener('pointerover', (e) => { if (e.pointerType === 'touch') return; const el = hotOf(e); if (el) hotStatus(el.dataset.seg || el.dataset.statusPick); });
$('#view').addEventListener('pointerout', (e) => { if (hotOf(e) && !e.relatedTarget?.closest?.('[data-seg], [data-status-pick]')) hotStatus(''); });
$('#view').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const el = e.target.closest('tr[data-id]'); if (el) openPanel(el.dataset.id); } });
$('#scrim').onclick = closePanel;
function syncHash() {
  const id = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (id && state.tickets.has(id)) { if (state.open !== id) openPanel(id); }
  else if (!id && state.open && !String(state.open).startsWith(NEW_TICKET)) closePanel();
}
window.addEventListener('popstate', syncHash);
window.addEventListener('hashchange', syncHash);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) closePanel(); });
// Keyboard: / = search, j / k = next / previous ticket of the current list (opens the first one when none is open).
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  if (e.key === '/' && !state.open) { e.preventDefault(); $('#search').focus(); return; }
  if (e.key !== 'j' && e.key !== 'k') return;
  if (state.view === 'decisions' || state.view === 'insights' || String(state.open || '').startsWith(NEW_TICKET)) return;
  const ids = [...document.querySelectorAll('#view [data-id]:not(.qmain):not(.nowmain)')].map((el) => el.dataset.id);
  if (!ids.length) return;
  const at = ids.indexOf(state.open);
  const next = at < 0 ? 0 : Math.min(ids.length - 1, Math.max(0, at + (e.key === 'j' ? 1 : -1)));
  if (ids[next] !== state.open) openPanel(ids[next]);
});

/* Boot */
$('#status').value = state.status;
try { const g = localStorage.getItem('elme-board-group'); if (g) state.group = g; } catch {}
try { const v = localStorage.getItem('elme-board-view'); if (v) document.querySelector(`.tabs [data-view="${v}"]`)?.click(); } catch {}
// The queue block shows PC status and which ticket runs; both come with board:meta, after the tickets.
// Rebuild the view when they change, or the queue says "PC offline" / "Next" while the header says online / running.
let queueSig = '';
function syncQueueView() {
  const running = Object.values(state.runs || {}).filter((r) => r.status === 'running' || r.status === 'queued').map((r) => r.ticketId).sort().join();
  const sig = `${state.metaSeen}|${pcOnline()}|${running}`;
  if (sig === queueSig) return;
  queueSig = sig;
  if (state.view !== 'decisions') render();
}
window.addEventListener('board:meta', (e) => {
  state.runnerStatus = e.detail?.runnerStatus || null;
  state.runs = e.detail?.runs || {};
  if (e.detail?.serverNow) state.skew = e.detail.serverNow - Date.now();
  state.metaSeen = true;
  renderPcStatus();
  syncQueueView();
  patchNow();
  // Do not rebuild the whole panel (that resets scroll on the phone).
  patchLiveRun();
});
setInterval(() => {
  patchLiveRun();
  patchNow();
  renderPcStatus();
  syncQueueView();
}, 1000);

(async () => {
  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('/sw.js', { scope: '/' }); } catch {}
  }
  db = await window.claude?.use?.('db') ?? null;
  const user = await window.claude?.use?.('user') ?? null;
  if (!db) { $('#notice').textContent = 'The board store is not available. Check the API / login.'; return; }
  const cw = user ? await user.can('data.write') : null;
  state.canWrite = cw !== false;
  let got = 0;
  const ready = () => { if (++got >= 2) $('#notice').hidden = state.tickets.size > 0; if (!state.tickets.size) $('#notice').textContent = 'No tickets yet. Seed the board (npm run seed -- --force).'; };
  db.collection('tickets').onSnapshot((s) => {
    const first = !state.tickets.size;
    state.tickets = new Map(s.docs.map((d) => [d.id, d.data()])); render(); ready();
    if (first && location.hash) syncHash();
    if (state.pendingOpen && state.tickets.has(state.pendingOpen)) { const id = state.pendingOpen; state.pendingOpen = null; openPanel(id); }
  },
    (e) => { $('#notice').hidden = false; $('#notice').textContent = `Tickets could not load (${e.code}). Reload the page.`; });
  db.collection('decisions').onSnapshot((s) => { state.decisions = new Map(s.docs.map((d) => [d.id, d.data()])); render(); ready(); }, () => {});
})();
</script>

</body>
</html>
