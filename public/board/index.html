<title>Elme Board</title>
<style>
/* Elme palette tuned for a tool: warm paper, sage band, olive actions, muted status fills that all read with charcoal text. */
@font-face { font-family: Karla; src: url("/fonts/Karla-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: Karla; src: url("/fonts/Karla-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: Karla; src: url("/fonts/Karla-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: Karla; src: url("/fonts/Karla-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "DM Serif Display"; src: url("/fonts/DMSerifDisplay-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
:root {
  --bg: #F5F4EF;
  --band: #E9EDE3;
  --surface: #FFFFFF;
  --surface-2: #F2F1EB;
  --line: #DDDBD2;
  --fg: #2F2E2A;
  --muted: #6B6F66;
  --accent: #55644A;
  --secondary: #ADBBA1;
  --on-accent: #FFFFFF;
  --ink-on: #2F2E2A;
  --st-todo: #E7E2D8;
  --st-progress: #E9C873;
  --st-qa: #C9D4DF;
  --st-review: #A3B8C9;
  --st-blocked: #E4A593;
  --st-done: #BCCAAE;
  --h-fe: #BCCAAE;
  --h-be: #C9D4DF;
  --h-qa: #E2D8C5;
  --h-roman: #E9C873;
  --shadow: 0 1px 2px rgb(47 46 42 / .05);
  --warn-text: #9E3F2A;
  --ok-text: #55644A;
  --font: Karla, ui-sans-serif, system-ui, sans-serif;
  --display: "DM Serif Display", Georgia, serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --tap: 50px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 15px/20px var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  overscroll-behavior-y: contain;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: .02em; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band);
  display: grid; gap: 14px; padding-block: 16px 0; border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
h1 { margin: 0; font: 400 32px/35px var(--display); text-wrap: balance; display: flex; align-items: baseline; gap: 10px; }
h1 span { font: 500 15px/14px var(--font); letter-spacing: .5px; }
.sub { color: var(--muted); font-size: 14px; }
.pc-status {
  display: inline-flex; align-items: center; gap: 8px; margin-left: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 0;
  padding: 8px 14px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); min-height: 40px;
}
.pc-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.pc-status.online .dot { background: var(--ok-text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok-text) 25%, transparent); }
.pc-status.offline .dot { background: var(--warn-text); }
.pc-status .ico { width: 16px; height: 16px; }
.pc-status.offline { border-color: color-mix(in srgb, var(--st-blocked) 50%, var(--line)); }
.counters { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.counter { display: flex; gap: 6px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 8px 16px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); white-space: nowrap; min-height: 40px; }
.counter:hover { border-color: var(--accent); }
.counters .counter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.counters .counter[aria-pressed="true"] span { color: inherit; }
.counter b { font-size: 17px; }
.counter span { color: var(--muted); font-size: 13px; }
.counter.alert { border-color: var(--warn-text); background: color-mix(in srgb, var(--st-blocked) 30%, var(--surface)); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 6px 12px; margin-right: 10px; color: var(--muted); font-weight: 700; letter-spacing: .01em; min-height: var(--tap); }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.filters input, .filters select { background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; min-width: 0; min-height: 44px; }
.filters input { width: 220px; max-width: 60vw; }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); border-radius: 0; overflow: hidden; }
.seg button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seq { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 2.2em; display: inline-block; }
.wavebar { display: flex; align-items: center; gap: 10px; margin-left: auto; font: 600 13px var(--font); color: var(--muted); white-space: nowrap; }
.more { border-top: 1px solid var(--line); padding-top: 10px; }
.more > summary { cursor: pointer; font-weight: 700; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; min-height: 36px; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: '+'; margin-left: auto; font-size: 18px; }
.more[open] > summary::after { content: '–'; }
.more[open] { display: grid; gap: 10px; }
.wavebar .track { width: 120px; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.wavebar .fill { height: 100%; background: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 0; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.chip.ready { background: color-mix(in srgb, var(--st-done) 45%, var(--surface)); color: var(--ok-text); }
.chip.work { background: color-mix(in srgb, var(--st-progress) 40%, var(--surface)); color: var(--fg); }
.chip.work::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.tool { background: var(--surface-2); color: var(--fg); }
@media (prefers-reduced-motion: no-preference) { .chip.work::before { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .25; } } }
.runbox { background: var(--surface-2); border: 1px solid var(--line); border-radius: 0; padding: 12px; display: grid; gap: 10px; }
.runbox .runhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.runbox pre { margin: 0; max-height: 240px; overflow: auto; padding: 12px; border-radius: 0; background: #1d211b; color: #ecede6; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
.runner-pick { display: grid; gap: 8px; margin-bottom: 4px; }
.runner-pick .label { font-size: 13px; font-weight: 700; color: var(--muted); }

.notice { margin-top: 16px; padding: 12px 16px; border: 1px dashed var(--line); border-radius: 0; color: var(--muted); }
main { padding-top: 16px; }

/* Main table */
.group { margin-bottom: 22px; }
.group h2 { display: flex; gap: 10px; align-items: center; font: 400 21px/1.2 var(--display); margin: 0 0 10px; }
.group h2 .dot { width: 10px; height: 10px; border-radius: 3px; }
.group h2 small { color: var(--muted); font: 600 13px var(--font); }
.group h2 .wn { font: 700 12px var(--mono); color: var(--accent); }
.tablewrap { overflow-x: auto; border-left: 4px solid var(--gc, var(--line)); border-radius: 2px; box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; min-width: 860px; background: var(--surface); }
th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0 10px; height: 38px; text-align: left; vertical-align: middle; }
th { font-size: 11px; color: var(--muted); font-weight: 700; background: var(--surface-2); text-transform: uppercase; letter-spacing: .07em; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--surface-2); }
td.title { min-width: 0; }
td.title .t { display: flex; gap: 10px; align-items: center; }
td.statuscell { padding: 0; width: 140px; }
.status { display: flex; align-items: center; justify-content: center; height: 100%; min-height: 38px; font-weight: 600; color: var(--ink-on); padding: 0 8px; text-align: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 0; padding: 2px 10px; font-weight: 600; color: var(--ink-on); font-size: 12px; }
.holder { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 0; font-weight: 500; font-size: 11px; letter-spacing: .3px; color: var(--fg); }
.holder.none { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.kind { font-size: 11px; font-weight: 700; color: var(--muted); }
.dep { display: inline-block; margin: 2px 4px 2px 0; padding: 0 6px; border-radius: 4px; font-size: 11px; background: var(--surface-2); color: var(--muted); }
.dep.open { color: var(--warn-text); }
.dep.ok { color: var(--ok-text); }
td.upd { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(205px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: 2px; border-top: 4px solid var(--cc); min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 210px); }
.col header { display: flex; justify-content: space-between; padding: 10px 12px; font-weight: 700; }
.col header span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.col .cards { display: grid; gap: 8px; padding: 0 10px 12px; overflow-y: auto; min-height: 60px; }
.col.over { outline: 2px dashed var(--cc); outline-offset: -2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 12px; box-shadow: var(--shadow); display: grid; gap: 8px; cursor: grab; text-align: left; }
.card:hover { border-color: var(--accent); }
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.chip, .kind { white-space: nowrap; }
.card .ttl { font-weight: 600; }
.card .q { color: var(--warn-text); font-size: 12px; font-weight: 700; }

/* Decisions */
.decisions td { height: auto; padding-block: 10px; vertical-align: top; }

/* Mobile list (table view and decisions on phones) */
.mlist { display: grid; gap: 8px; }
.mitem { display: grid; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gc, var(--line)); border-radius: 0; padding: 14px; box-shadow: var(--shadow); width: 100%; }
.mitem .r1, .mitem .r3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.mitem .ttl { font-weight: 700; font-size: 15px; line-height: 1.3; }
.mitem .r3 { color: var(--muted); font-size: 12px; justify-content: flex-start; }
.jump { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.jump button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 0; padding: 6px 12px; font-weight: 700; font-size: 13px; min-height: 36px; }
.jump button i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--cc); }

/* Panel */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; }
aside.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); z-index: 21; background: var(--surface);
  border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.ph { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; background: var(--band); }
.ph .row1 { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.ph h3 { margin: 0; font: 400 24px/1.2 var(--display); text-wrap: balance; }
.close { background: none; border: 1px solid var(--line); border-radius: 0; width: 32px; height: 32px; flex: none; }
.ph .facts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.pb { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 20px 24px; display: grid; gap: 20px; align-content: start; }
.sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.prose { max-width: 70ch; overflow-wrap: anywhere; }
.prose p { margin: 0 0 8px; }
.prose ul { margin: 0 0 8px; padding-left: 18px; }
.prose code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 4px; padding: 0 4px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; }
.checks .ic { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--surface-2); color: var(--muted); }
.checks .ic.passed { background: var(--st-done); color: var(--ink-on); }
.checks .ic.failed { background: var(--st-blocked); color: var(--ink-on); }
.checks .by { color: var(--muted); font-size: 12px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.log li { border-left: 3px solid var(--lc, var(--line)); padding-left: 10px; }
.log .lh { color: var(--muted); font-size: 12px; display: flex; gap: 8px; }
.actions { display: grid; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.actions .question { background: color-mix(in srgb, var(--st-blocked) 22%, var(--surface)); border-left: 4px solid var(--warn-text); padding: 10px 14px; max-height: 40vh; overflow: auto; }
.actions .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg); }
.actions .check input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex: none; }
.actions .question h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--warn-text); }
.actions .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--fg); background: transparent; border-radius: 0; padding: 8px 24px; font-weight: 500; letter-spacing: .5px; min-height: 50px; line-height: 14px; }
.btn:hover { background: var(--fg); color: var(--on-accent); }
.tools-toggle .ico, .btn .ico, .tabs button .ico, .seg button .ico, .counter .ico, .jump button .ico, .close .ico, .chip .ico { width: 16px; height: 16px; flex: none; }
.tabs button, .seg button, .jump button, .close { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.counter { gap: 8px; align-items: center; }
.btn.primary, .btn.rework { background: var(--fg); border-color: var(--fg); color: var(--on-accent); }
.btn.primary:hover, .btn.rework:hover, .btn.done:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.done { background: var(--fg); border-color: var(--fg); color: var(--on-accent); }
@media (prefers-reduced-motion: no-preference) {
  .btn.rework-in { animation: rework-in 320ms var(--ease-out), rework-glow 800ms ease; }

function mitem(t, c) {

function render() {

  document.querySelectorAll('#grouping button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.group === state.group)));
  const v = $('#view');
  // On the phone the list sits under the full-screen ticket: rebuild it when the ticket closes, not under the finger.
  if (state.open && narrow.matches) { viewDirty = true; renderPanel(); return; }
  viewDirty = false;
  const html = state.view === 'table' ? renderTable() : state.view === 'kanban' ? renderKanban() : renderDecisions();
  if (viewHtml !== html) {

  p.innerHTML = `

      <div class="facts">${pill(t.status)} ${holder(t.holder)} <span class="chip tool">${esc(runnerLabel(t))}</span> <span>${esc(t.epic)}</span> <span>${esc(t.kind)}</span>

function ideaVerb(t) { return t.status === 'done' ? 'Rework' : 'Start'; }
function ideaControls(t) {

function actions(t) {

  if (t.holder === 'seo' && t.waiting) return `${runnerSeg()}<p class="empty">${pcOnline() ? 'SEO agent is writing the plan on your PC; the builder starts right after.' : 'PC offline — the SEO plan starts when the runner is back.'}</p>`;
  if (t.holder === 'idea' && t.waiting) return `${runnerSeg()}<p class="empty">${pcOnline() ? 'Marketing review is running on your PC.' : 'PC offline — the review starts when the runner is back.'}</p>`;

  });
  const note = $('#idea-note');
  const reworkBtn = $('#panel [data-act="build"]');
  if (note && reworkBtn) note.addEventListener('input', () => {
    const hasNote = note.value.trim().length > 0;
    const mode = hasNote ? 'note' : (t.ideaVerdict ? 'idea' : '');
    const verb = ideaVerb(t);
    if (!mode) { reworkBtn.hidden = true; return; }
    if (reworkBtn.dataset.mode === mode && !reworkBtn.hidden) return;
    reworkBtn.dataset.mode = mode;
    reworkBtn.hidden = false;
    reworkBtn.innerHTML = `${ico(hasNote ? 'play' : 'spark')}${verb} with ${hasNote ? 'your note' : 'marketing idea'}`;
    reworkBtn.classList.remove('rework-in');
    void reworkBtn.offsetWidth;
    reworkBtn.classList.add('rework-in');
  });
  $('#panel').querySelectorAll('[data-act]').forEach((b) => {
    b.onclick = async () => {
      const ideaText = $('#idea-note')?.value.trim() || '';
      const text = ($('#note') || $('#answer'))?.value.trim() || '';
      try {
        b.disabled = true;
        const act = b.dataset.act;
        const runner = preferredRunner();
        if (act === 'stop') {
          await window.boardStopRun(b.dataset.run);
          toast('Stop requested');
          b.disabled = false;
          return;
        }
        if (act === 'assign' && $('#seo-first')?.checked && b.dataset.h !== 'qa') {
          await change(t, { ...requestSeo(t, assign(t, b.dataset.h)), runner }, `Roman started the ticket: SEO plan first, then the ${HOLDER[b.dataset.h][2]} (${runner}).`, 'log');
          return;
        }
        if (act === 'retry-merge') { await change(t, { mergeRequested: true, mergeError: null, updatedAt: Date.now() }, 'Roman asked the PC to retry the merge into main.', 'log'); return; }
        if (act === 'goto-decisions') { closePanel(); document.querySelector('.tabs [data-view="decisions"]').click(); return; }
        if (['fresh', 'resolve', 'stash', 'skip', 'switch'].includes(act)) {
          const flag = { fresh: { resetBranch: true }, resolve: { resolveConflict: true }, stash: { stashFirst: true }, skip: { skipChecks: true }, switch: {} }[act];
          const useRunner = act === 'switch' ? b.dataset.runner : runner;
          if (act === 'switch') { state.pickRunner = useRunner; try { localStorage.setItem('elme-board-runner', useRunner); } catch {} }
          const msg = {
            fresh: 'Roman chose: start over from main.', resolve: 'Roman chose: the agent resolves the merge conflict.',
            stash: 'Roman chose: stash the local changes on the PC and run.', skip: 'Roman chose: run anyway (skip the dependency/decision check once).',
            switch: `Roman switched the runner to ${useRunner} and reran.`,
          }[act] + (text ? `\n\n${text}` : '');
          // Back to the agent that was blocked, with the one-shot flag the PC runner reads.
          await change(t, { ...assign(t.status === 'blocked' ? { ...t, status: 'todo' } : t, b.dataset.h), runner: useRunner, prev: null, ...flag }, msg, 'answer');
          return;
        }
        if (act === 'assign' || act === 'rerun') {
          const patch = { ...assign(t, b.dataset.h), runner, prev: null };
          const verb = act === 'rerun' ? 'reran' : 'started';
          await change(t, patch, `Roman ${verb} the ticket with the ${HOLDER[b.dataset.h][2]} (${runner}).${text ? `\n\n${text}` : ''}`, act === 'rerun' && text ? 'answer' : 'log');
        }
        else if (act === 'reopen') {
          if (!text) { toast('Write what to change first.'); b.disabled = false; return; }
          await change(t, { ...reopen(t, b.dataset.h), runner }, text, 'bug');
        }
        else if (act === 'back') {
          if (!text) { toast('Write the bug first, so the agent knows what to fix.'); b.disabled = false; return; }
          const patch = t.status === 'done' ? { ...assign({ ...t, status: 'review' }, b.dataset.h) } : assign(t, b.dataset.h);
          await change(t, { ...patch, runner }, text, 'bug');
        }
        else if (act === 'seo') await change(t, { ...requestSeo(t), runner }, `Roman asked for an SEO review (${runner}).`, 'log');
        else if (act === 'ideas') await change(t, { ...requestIdeas(t), runner }, `Roman asked for a marketing review (${runner}).`, 'log');
        else if (act === 'build') {
          const hasNote = !!ideaText;
          if (!hasNote && !t.ideaVerdict) { toast('Get a marketing review, or write your own note.'); b.disabled = false; return; }
          const who = devHolder(t);
          const verb = ideaVerb(t);
          const brief = hasNote
            ? `${verb} with Roman's note: ${ideaText}`
            : `${verb} with the marketing idea (${t.ideaVerdict}).`;
          await change(t, { ...buildFromIdeas(t), runner }, brief, 'note');
          toast(`${t.id}: ${verb.toLowerCase()} with ${HOLDER[who][2]}`);
        } else if (act === 'answer') {
          if (!text) { toast('Write the answer first.'); b.disabled = false; return; }
          await change(t, { ...answer(t), runner }, text, 'answer');
        } else if (act === 'done') await change(t, done(t), text || 'Accepted after review.', 'log');
        else if (act === 'note' && text) await addLog(t.id, 'note', text);
      } catch (e) { toast(e.message || 'Could not save. Try again.'); b.disabled = false; }
    };
  });
}
async function change(t, patch, text, kind) {
  await db.doc(`tickets/${t.id}`).update(patch);
  if (text) await addLog(t.id, kind, text);
  toast(`${t.id}: ${STATUS[patch.status]?.label || 'saved'}`);
}
async function addLog(id, kind, text) {
  const ref = db.doc(`log/${id}`);
  if (ref.append) return ref.append({ at: Date.now(), who: 'roman', kind, text });
  const snap = await ref.get();
  const entries = snap.exists ? [...(snap.data().entries || [])] : [];
  entries.push({ at: Date.now(), who: 'roman', kind, text });
  await ref.set({ entries });
}
const NEW_TICKET = '__new__';
function openNewTicket() {
  closePanel();
  state.open = NEW_TICKET;
  const all = [...state.tickets.values()];
  const waves = [...new Map(all.filter((t) => t.wave).sort((a, b) => a.wave - b.wave).map((t) => [t.wave, t.waveName])).entries()];
  const epics = [...new Set(all.sort((a, b) => (a.order || 0) - (b.order || 0)).map((t) => t.epic))];
  const p = $('#panel');
  p.innerHTML = `
    <div class="ph"><div class="row1"><h3>New ticket</h3><button class="close" id="close" aria-label="Close">${ico('x')}</button></div></div>
    <div class="pb"><form class="form" id="new-form" novalidate>
      <label>Title<input id="nt-title" required maxlength="160" placeholder="e.g. Custom select with search"></label>
      <div class="row2">
        <label>Kind<select id="nt-kind"><option>FE</option><option>BE</option><option>UX</option></select></label>
        <label>Run with<select id="nt-runner"><option value="claude"${preferredRunner() === 'claude' ? ' selected' : ''}>Claude</option><option value="cursor"${preferredRunner() === 'cursor' ? ' selected' : ''}>Cursor</option></select></label>
      </div>
      <div class="row2">
        <label>Plan stage<select id="nt-wave">${waves.map(([w, n]) => `<option value="${w}">${w} · ${esc(n)}</option>`).join('')}</select></label>
        <label>Epic<select id="nt-epic">${epics.map((e) => `<option>${esc(e)}</option>`).join('')}</select></label>
      </div>
      <label>Depends on <small>ticket ids, comma separated</small><input id="nt-deps" placeholder="FE-02, FE-03" autocapitalize="characters"></label>
      <label>Scope <small>what the agent builds</small><textarea id="nt-scope" rows="5"></textarea></label>
      <label>Ref <small>old code, URLs, files (optional)</small><textarea id="nt-ref" rows="2"></textarea></label>
      <label>QA checks <small>one per line</small><textarea id="nt-qa" rows="4"></textarea></label>
    </form></div>
    <div class="actions"><div class="btns">
      <button class="btn primary" data-new="start">${ico('play')}Create and start</button>
      <button class="btn" data-new="create">${ico('plus')}Create</button>
    </div></div>`;
  p.hidden = false; $('#scrim').hidden = false;
  document.documentElement.classList.add('panel-open');
  $('#close').onclick = closePanel;
  $('#nt-title').focus();
  p.querySelectorAll('[data-new]').forEach((b) => b.onclick = async () => {
    const title = $('#nt-title').value.trim();
    if (!title) { toast('Give the ticket a title.'); $('#nt-title').focus(); return; }
    const w = Number($('#nt-wave').value);
    const input = {
      title, kind: $('#nt-kind').value, epic: $('#nt-epic').value, wave: w, waveName: waves.find(([x]) => x === w)?.[1],
      runner: $('#nt-runner').value,
      deps: $('#nt-deps').value.toUpperCase().split(/[\s,]+/).filter((x) => /^(FE|BE|UX)-\d+$/.test(x)),
      scope: $('#nt-scope').value.trim(), ref: $('#nt-ref').value.trim(),
      qa: $('#nt-qa').value.split('\n').map((x) => x.trim()).filter(Boolean),
    };
    try {
      b.disabled = true;
      const t = await window.boardCreateTicket(input);
      await addLog(t.id, 'log', `Roman created the ticket.`);
      if (b.dataset.new === 'start') {
        const h = devHolder(t);
        await db.doc(`tickets/${t.id}`).update({ ...assign(t, h), runner: input.runner, prev: null });
        await addLog(t.id, 'log', `Roman started the ticket with the ${HOLDER[h][2]} (${input.runner}).`);
      }
      toast(`${t.id} created`);
      state.pendingOpen = t.id;
      closePanel();
      await window.boardRefresh?.();
    } catch (e) { toast(e.message || 'Could not create the ticket.'); b.disabled = false; }
  });
}
$('#new-ticket').onclick = openNewTicket;

function openPanel(id) {
  state.open = id; state.log = null;
  const t0 = state.tickets.get(id);
  // Ticket's saved runner wins when opening; otherwise keep last UI choice.
  if (t0?.runner === 'claude' || t0?.runner === 'cursor') state.pickRunner = t0.runner;
  $('#panel').hidden = false; $('#scrim').hidden = false;
  document.documentElement.classList.add('panel-open');
  $('#panel').scrollTop = 0;
  logUnsub?.();
  logUnsub = db ? db.doc(`log/${id}`).onSnapshot((s) => { state.log = s.exists ? s.data() : null; renderPanel(); }, () => {}) : null;
  renderPanel();
  $('#close')?.focus();
}
function closePanel() {
  state.open = null; panelKey = ''; logUnsub?.(); logUnsub = null;
  $('#panel').hidden = true; $('#scrim').hidden = true;
  document.documentElement.classList.remove('panel-open');
  if (viewDirty) render();
}

/* Kanban drag and drop */
let dragId = null;
document.addEventListener('dragstart', (e) => { const c = e.target.closest?.('.card'); if (c) { dragId = c.dataset.id; e.dataTransfer.setData('text/plain', dragId); } });
document.addEventListener('dragover', (e) => { const col = e.target.closest?.('.col'); if (col && dragId) { e.preventDefault(); document.querySelectorAll('.col.over').forEach((x) => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { const col = e.target.closest?.('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
document.addEventListener('drop', async (e) => {
  const col = e.target.closest?.('.col'); if (!col || !dragId) return;
  e.preventDefault(); col.classList.remove('over');
  const t = state.tickets.get(dragId); dragId = null;
  const to = col.dataset.status;
  if (!t || t.status === to || !state.canWrite) return;
  try {
    const runner = preferredRunner();
    if (to === 'in_progress') await change(t, { ...assign(t, t.kind === 'BE' ? 'be' : 'fe'), runner }, `Roman started the ticket with the ${t.kind === 'BE' ? 'BE' : 'FE'} agent (${runner}).`, 'log');
    else if (to === 'in_qa') await change(t, { ...assign(t, 'qa'), runner }, `Roman sent the ticket to the QA agent (${runner}).`, 'log');
    else if (to === 'done') await change(t, done(t), 'Accepted after review.', 'log');
    else { toast('Open the ticket to do that.'); openPanel(t.id); }
  } catch (err) { toast(err.message); }
});

/* Events */
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  state.view = b.dataset.view;
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  try { localStorage.setItem('elme-board-view', state.view); } catch {}
  render();
});
$('#search').oninput = (e) => { state.q = e.target.value; render(); renderToolsCount(); };
$('#kind').onchange = (e) => { state.kind = e.target.value; render(); renderToolsCount(); };
$('#grouping').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; state.group = b.dataset.group; try { localStorage.setItem('elme-board-group', state.group); } catch {} render(); renderToolsCount(); };
$('#epic').onchange = (e) => { state.epic = e.target.value; render(); renderToolsCount(); };
$('#tools-toggle').onclick = () => {
  const open = !document.body.classList.contains('show-tools');
  document.body.classList.toggle('show-tools', open);
  $('#tools-toggle').setAttribute('aria-expanded', String(open));
};
function renderToolsCount() {
  const n = [state.q, state.kind, state.epic].filter(Boolean).length + (state.group === 'status' ? 1 : 0);
  const b = $('#tools-count'); b.hidden = !n; b.textContent = n;
}
$('#counters').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.goto) { document.querySelector(`.tabs [data-view="${b.dataset.goto}"]`).click(); return; }
  state.focus = state.focus === b.dataset.focus ? '' : b.dataset.focus;
  if (state.view === 'decisions') document.querySelector('.tabs [data-view="table"]').click(); else render();
});
narrow.addEventListener('change', render);
async function decide(id, chosen) {
  const d = state.decisions.get(id);
  if (!d) return toast(`No decision ${id}`);
  const text = String(chosen || '').trim();
  if (!text) return toast('Write or pick an option first.');
  try {
    await db.doc(`decisions/${id}`).update({ status: 'decided', chosen: text });
    state.decisions.set(id, { ...d, status: 'decided', chosen: text, version: (d.version ?? 1) + 1 });
    render();
    toast(`${id}: decided`);
  } catch (err) { toast(err.message || 'Could not save decision'); }
}

async function reopenDecision(id) {
  const d = state.decisions.get(id);
  if (!d) return;
  try {
    await db.doc(`decisions/${id}`).update({ status: 'open', chosen: null });
    state.decisions.set(id, { ...d, status: 'open', chosen: null, version: (d.version ?? 1) + 1 });
    render();
    toast(`${id}: open again`);
  } catch (err) { toast(err.message || 'Could not reopen decision'); }
}

$('#view').addEventListener('click', (e) => {
  const actBtn = e.target.closest('[data-act][data-dec]');
  if (actBtn) {
    e.preventDefault();
    const id = actBtn.dataset.dec;
    if (actBtn.dataset.act === 'pick-decision') return decide(id, actBtn.dataset.chosen);
    if (actBtn.dataset.act === 'write-decision') return decide(id, document.getElementById('dec-' + id)?.value);
    if (actBtn.dataset.act === 'reopen-decision') return reopenDecision(id);
    return;
  }
  if (e.target.closest('textarea, input, label, .btns')) return;
  const j = e.target.closest('[data-jump]');
  if (j) { document.getElementById('col-' + j.dataset.jump)?.closest('.col').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', inline: 'center', block: 'nearest' }); return; }
  const el = e.target.closest('[data-id]'); if (el) openPanel(el.dataset.id);
});
$('#view').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const el = e.target.closest('tr[data-id]'); if (el) openPanel(el.dataset.id); } });
$('#scrim').onclick = closePanel;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) closePanel(); });

/* Boot */
try { const g = localStorage.getItem('elme-board-group'); if (g) state.group = g; } catch {}
try { const v = localStorage.getItem('elme-board-view'); if (v) document.querySelector(`.tabs [data-view="${v}"]`)?.click(); } catch {}
window.addEventListener('board:meta', (e) => {
  state.runnerStatus = e.detail?.runnerStatus || null;
  state.runs = e.detail?.runs || {};
  if (e.detail?.serverNow) state.skew = e.detail.serverNow - Date.now();
  state.metaSeen = true;
  renderPcStatus();
  // Do not rebuild the whole panel (that resets scroll on the phone).
  patchLiveRun();
});
setInterval(() => {
  patchLiveRun();
  renderPcStatus();
}, 1000);

(async () => {
  if ('serviceWorker' in navigator) {
    try { await navigator.serviceWorker.register('/sw.js', { scope: '/' }); } catch {}
  }
  db = await window.claude?.use?.('db') ?? null;
  const user = await window.claude?.use?.('user') ?? null;
  if (!db) { $('#notice').textContent = 'The board store is not available. Check the API / login.'; return; }
  const cw = user ? await user.can('data.write') : null;
  state.canWrite = cw !== false;
  let got = 0;
  const ready = () => { if (++got >= 2) $('#notice').hidden = state.tickets.size > 0; if (!state.tickets.size) $('#notice').textContent = 'No tickets yet. Seed the board (npm run seed -- --force).'; };
  db.collection('tickets').onSnapshot((s) => {
    state.tickets = new Map(s.docs.map((d) => [d.id, d.data()])); render(); ready();
    if (state.pendingOpen && state.tickets.has(state.pendingOpen)) { const id = state.pendingOpen; state.pendingOpen = null; openPanel(id); }
  },
    (e) => { $('#notice').hidden = false; $('#notice').textContent = `Tickets could not load (${e.code}). Reload the page.`; });
  db.collection('decisions').onSnapshot((s) => { state.decisions = new Map(s.docs.map((d) => [d.id, d.data()])); render(); ready(); }, () => {});
})();
</script>
